name: update-specs
# Расписания нет намеренно. WBaaS (анти-бот WB) с ~06.08.2026 режет портал
# документации по репутации IP: с датацентрового адреса челлендж не проходит
# НИКАКОЙ браузер (замер 2026-08-11, раннер GitHub 20.106.182.192 — три
# попытки headed под xvfb, все «Подозрительная активность»). Поэтому job
# исполняется на self-hosted раннере с домашним адресом, а раз он живёт не
# круглосуточно — запуск только руками.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: [self-hosted, wb-specs]
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей
        shell: powershell   # на раннере Windows PowerShell 5.1, pwsh не установлен
        run: |
          python -m pip install -q requests pyyaml playwright
          python -m playwright install chromium

      # Браузер headed (см. шапку fetch_specs.py) — на время работы
      # на экране появится окно Chromium, это ожидаемо.
      - name: Скачивание спек (all-or-nothing)
        shell: powershell   # на раннере Windows PowerShell 5.1, pwsh не установлен
        run: python scripts/fetch_specs.py --out specs

      - name: Перегенерация авто-зон
        shell: powershell   # на раннере Windows PowerShell 5.1, pwsh не установлен
        run: python scripts/generate_tables.py

      - name: Дифф и описание PR
        id: drift
        # Git Bash по полному пути: в PATH раннера его нет, а переписывать шаг
        # на PowerShell 5.1 нельзя — check_drift.py печатает markdown по-русски,
        # и вывод поедет по кодировкам консоли.
        shell: 'C:\Program Files\Git\bin\bash.exe -e {0}'
        run: |
          python scripts/check_drift.py > pr_body.md
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: PR с обновлением
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/spec-update-${{ steps.drift.outputs.date }}
          title: "Спеки WB обновились — ${{ steps.drift.outputs.date }}"
          body-path: pr_body.md
          commit-message: "auto: обновление снапшота спек и таблиц эндпоинтов"
          add-paths: |
            specs/
            references/
          delete-branch: true
